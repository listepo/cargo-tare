# git-cliff configuration. `just changelog` regenerates CHANGELOG.md from git history.
# Commit subjects are `<task-id>: <title>` (T22: …), `<area>: <title>` (plan:, docs:, ci:) or plain prose.
# git-cliff is pinned in mise.toml; run it as `mise exec -- git-cliff`.

[changelog]
# git-cliff writes this header itself — on `just changelog` and on release-plz's release PR,
# which renders the crates' changelogs with this same file — so no generated changelog can
# lose the marker. `@generated` is the marker linters and review tools look for.
header = """
<!-- @generated by git-cliff from cliff.toml — DO NOT EDIT. Regenerate: `just changelog`. -->
# Changelog

Generated by git-cliff from commit subjects (`just changelog`; release-plz on a release PR).
Do not edit by hand — change the commit or `cliff.toml` and regenerate.
Unreleased work is listed first; a `v*` tag starts a version section.

"""
body = """
{% if version %}## {{ version | trim_start_matches(pat="v") }} — {{ timestamp | date(format="%Y-%m-%d") }}{% else %}## Unreleased{% endif %}
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | striptags | trim }}
{% for commit in commits %}- {{ commit.message | split(pat="\n") | first | trim }} (`{{ commit.id | truncate(length=7, end="") }}`)
{% endfor %}{% endfor %}
"""
trim = true

[git]
conventional_commits = false
filter_unconventional = false
split_commits = false
protect_breaking_commits = false
filter_commits = false
tag_pattern = "v[0-9].*"
topo_order = false
sort_commits = "oldest"
# The `<!-- N -->` prefix orders the groups; `striptags` in the body hides it.
commit_parsers = [
  { message = "^T[0-9]+(\\.[0-9]+)*:", group = "<!-- 0 -->Tasks" },
  { message = "^plan:", group = "<!-- 1 -->Plan" },
  { message = "^docs:", group = "<!-- 2 -->Docs" },
  { message = "^(ci|build|chore|deps):", group = "<!-- 3 -->Tooling" },
  # `release: vX.Y.Z` is bookkeeping the next release would otherwise list.
  { message = "^release:", skip = true },
  { message = ".*", group = "<!-- 4 -->Other" },
]
