name: sonarcloud

# SonarCloud OSS analysis: pull requests to main (drafts skipped), pushes to main, and manual
# runs. Soft-fail for now: the coverage and scan steps use continue-on-error, and every step
# soft-skips when the SONAR_TOKEN secret is empty (fork pull requests, or before the secret is
# added). Setup and how to make it blocking: docs/sonarcloud-setup.md
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

env:
  # Empty on fork pull requests and until the repository secret is added.
  SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
  CARGO_TERM_COLOR: always

jobs:
  sonarcloud:
    if: github.event.pull_request.draft == false || github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Skip SonarCloud (no token)
        if: env.SONAR_TOKEN == ''
        run: |
          echo "::notice::SONAR_TOKEN is not set; skipping SonarCloud analysis."
          echo "Expected for fork pull requests and before the secret is added."
          echo "See docs/sonarcloud-setup.md."

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: env.SONAR_TOKEN != ''
        with:
          # Full history: Sonar uses blame data for new-code detection.
          fetch-depth: 0

      # Rust (with rustfmt/clippy), just and git-cliff from mise.toml, same as verify.yml.
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        if: env.SONAR_TOKEN != ''

      - name: llvm-tools-preview
        if: env.SONAR_TOKEN != ''
        run: rustup component add llvm-tools-preview

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        if: env.SONAR_TOKEN != ''
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Install cargo-llvm-cov
        if: env.SONAR_TOKEN != ''
        continue-on-error: true
        uses: taiki-e/install-action@9983c65e42da123ff25d1f78505eb6de315aa172 # v2.87.20
        with:
          tool: cargo-llvm-cov

      - name: Coverage (LCOV)
        if: env.SONAR_TOKEN != ''
        continue-on-error: true
        run: |
          mkdir -p coverage
          cargo llvm-cov --workspace --locked --lcov --output-path coverage/lcov.info

      - name: SonarCloud scan
        if: env.SONAR_TOKEN != ''
        continue-on-error: true
        uses: SonarSource/sonarqube-scan-action@ba9859eae8dd6bd29e412f25ddbbef3d032000f4 # v8.2.2
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: https://sonarcloud.io
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
