# T43. The gate on every pull request, and on main after a merge. The jobs themselves live in
# verify.yml, which the release workflows run too: a release gate narrower than the one every
# pull request passed would let through what that one caught.
name: ci

on:
  # Push to main, non-draft pull requests and the weekly schedule run this through
  # pipeline.yml (`workflow_call`), in parallel with the other checks and behind its `gate` job.
  workflow_call:
  workflow_dispatch:

# A newer commit on the same ref cancels the previous run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    # Draft pull requests still emit `synchronize`; skip until ready_for_review.
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    uses: ./.github/workflows/verify.yml
