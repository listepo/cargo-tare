# T43. The entry point for a release: raise the version, land one commit, and start the
# dist Release workflow for it. Nobody types a version number.
#
# Why this is a second workflow rather than a step inside release.yml: release.yml is generated by
# `dist generate` and must never be hand-edited. A workflow_dispatch started with GITHUB_TOKEN is
# the documented exception to GitHub's "events from GITHUB_TOKEN do not start workflows" rule, so
# no personal access token is needed here.
name: Bump and release

on:
  workflow_dispatch:
    inputs:
      level:
        description: which part of the version to raise, if the current one is already released
        default: patch
        type: choice
        options: [patch, minor, major]
      # No `dry_run` input: a ticked box made this workflow end green with nothing released,
      # and a green "Bump and release" reads as a release. The preview is local only —
      # `scripts/release.sh <level> --dry-run` — so every run of this workflow ships.

permissions:
  contents: write # push the version commit
  actions: write # dispatch release.yml

jobs:
  # The same gate every pull request passes, on the commit this release is cut from. The
  # version commit `release.sh` makes afterwards touches only Cargo.toml, Cargo.lock and
  # CHANGELOG.md, so what is tested here is the code that ships.
  verify:
    uses: ./.github/workflows/verify.yml

  bump:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # Tags decide whether the current version was already released; the changelog reads history.
          fetch-depth: 0
          persist-credentials: true
      # The toolchain pinned in mise.toml — same cargo and git-cliff as local.
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          scripts/release.sh "${{ inputs.level }}"
