[package]
name = "cargo-tare"
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
description = "Shrink Cargo target directories without slowing builds"
publish = false

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
rayon = "1.12.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
toml = "1.1.6"
walkdir = "2.5.0"

# Transparent compression is an APFS feature, and so is the crate that drives it.
[target.'cfg(target_os = "macos")'.dependencies]
applesauce = "0.8.8"

[dev-dependencies]
assert_cmd = "2.2.2"
predicates = "3.1.4"
tempfile = "3.27.0"
trycmd = "1.2.1"
